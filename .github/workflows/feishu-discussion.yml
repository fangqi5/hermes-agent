name: Feishu discussion contract
on:
  push:
    branches: [fix/feishu-native-discussion]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/test_feishu_discussion.py -v
      - run: python -m py_compile plugins/platforms/feishu/a2a.py plugins/platforms/feishu/adapter.py plugins/platforms/feishu/discussion.py
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: contract
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.28'
      - run: uv sync --locked --python 3.11 --extra dev --extra feishu
      - run: uv run --no-sync pytest tests/gateway/test_feishu.py -q
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-test-home
          HERMES_DISABLE_LAZY_INSTALLS: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-feishu-discussion
          path: |
            plugins/platforms/feishu/a2a.py
            plugins/platforms/feishu/adapter.py
            plugins/platforms/feishu/discussion.py
          if-no-files-found: error
